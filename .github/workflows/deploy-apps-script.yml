name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: echo "$CLASPRC" > ~/.clasprc.json

      - name: Create .clasp.json
        env:
          SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
        run: |
          echo "{\"scriptId\":\"$SCRIPT_ID\",\"rootDir\":\".\"}" > apps-script/.clasp.json

      - name: Push to Apps Script
        run: cd apps-script && clasp push

      - name: Deploy
        run: cd apps-script && clasp deploy --description "CI deploy ${{ github.sha }}"
